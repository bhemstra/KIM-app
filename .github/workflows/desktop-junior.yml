# Bouwt de Junior Computer als desktop-app voor Windows en macOS.
# De installatiebestanden staan daarna onder "Artifacts" bij de workflow-run.
name: Junior desktop-apps

on:
  push:
    paths:
      - 'desktop/**'
      - 'js/**'
      - 'css/**'
      - 'junior.html'
      - '.github/workflows/desktop-junior.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            rust-targets: ''
            args: --bundles nsis,msi
            out: desktop/src-tauri/target/release/bundle/*/*.*
          - platform: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            out: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests van de emulator
        run: npm test
        working-directory: .

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      - run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: junior-computer-${{ matrix.platform }}
          path: ${{ matrix.out }}
          if-no-files-found: error
